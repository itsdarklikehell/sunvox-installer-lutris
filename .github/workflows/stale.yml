name: Close stale issues and PRs

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
      - name: Close stale issues and PRs
        uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-issue-message: 'Dit issue is gemarkeerd als stale omdat het 60 dagen geen activiteit heeft gehad. Het wordt binnen 7 dagen gesloten tenzij nieuwe activiteit plaatsvindt.'
          stale-pr-message: 'Deze pull request is gemarkeerd als stale omdat het 60 dagen geen activiteit heeft gehad. Deze wordt binnen 7 dagen gesloten tenzij nieuwe activiteit plaatsvindt.'
          close-issue-message: 'Dit issue is gesloten wegens inactiviteit. Open opnieuw indien nog steeds relevant.'
          close-pr-message: 'Deze pull request is gesloten wegens inactiviteit. Open opnieuw indien nog steeds relevant.'
          days-before-stale: 60
          days-before-close: 7
          days-before-issue-stale: 60
          days-before-issue-close: 7
          days-before-pr-stale: 60
          days-before-pr-close: 7
          exempt-issue-labels: 'pinned,security,bug'
          exempt-pr-labels: 'pinned,security'
          exempt-all-milestones: true
          exempt-all-assignees: false
